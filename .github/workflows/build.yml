name: Build APK

on:
  push:
    branches: [main]
  # Pull requests (including from forks) only build; they never publish, sign a release or edit issues.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the publishing steps below run with write access, and only on this repo's main.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      # Key rotation (v1.14.2+): v1/v2 stay on the old key for Android 8, v3 moves to the new key with a lineage
      # for Android 9+. The old key keeps installed-data (so current installs update) but loses rollback,
      # permission, shared-uid and auth, so an APK signed only with the old (public) key can't replace a rotated install.
      # The new key lives only in Actions secrets; PR builds never see it.
      - name: Rotate signing key
        if: github.event_name != 'pull_request' && github.repository == 'lacksonkapapahue/Blaze-agent'
        env:
          NEW_P12: ${{ secrets.BLAZE_SIGNING_P12 }}
          NEW_PASS: ${{ secrets.BLAZE_SIGNING_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SIGNER="$BT/apksigner"
          umask 077; mkdir -p "$RUNNER_TEMP/k"; K="$RUNNER_TEMP/k"
          DRY=""
          if [ -z "$NEW_P12" ] || [ -z "$NEW_PASS" ]; then
            echo "::warning::BLAZE_SIGNING_P12 / BLAZE_SIGNING_PASS not set; this build stays on the old key. Dry-running the rotation with a throwaway key."
            DRY=1; NEW_PASS=dryrunpass; export NEW_PASS
            keytool -genkeypair -keystore "$K/new.p12" -storetype PKCS12 -alias blaze -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=dry" -storepass "$NEW_PASS" -keypass "$NEW_PASS" >/dev/null
          else
            echo "$NEW_P12" | base64 -d > "$K/new.p12"
          fi
          export OLD_PASS=android
          "$SIGNER" rotate --out "$K/lineage" \
            --old-signer --ks keystore/blaze.keystore --ks-key-alias androiddebugkey --ks-pass env:OLD_PASS --key-pass env:OLD_PASS \
              --set-installed-data true --set-rollback false --set-permission false --set-shared-uid false --set-auth false \
            --new-signer --ks "$K/new.p12" --ks-type PKCS12 --ks-key-alias blaze --ks-pass env:NEW_PASS --key-pass env:NEW_PASS
          for APK in app/build/outputs/apk/release/*.apk; do
            if [ -n "$DRY" ]; then cp "$APK" "$K/dry.apk"; APK="$K/dry.apk"; fi
            "$SIGNER" sign --ks keystore/blaze.keystore --ks-key-alias androiddebugkey --ks-pass env:OLD_PASS --key-pass env:OLD_PASS \
              --next-signer --ks "$K/new.p12" --ks-type PKCS12 --ks-key-alias blaze --ks-pass env:NEW_PASS --key-pass env:NEW_PASS \
              --lineage "$K/lineage" --rotation-min-sdk-version 28 "$APK"
            "$SIGNER" verify --print-certs -v "$APK" | grep -E "Verified using|Signer|SHA-256" | head -20
          done
          rm -rf "$K"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blaze-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish APK to apk branch
        if: github.event_name != 'pull_request' && github.repository == 'lacksonkapapahue/Blaze-agent' && github.ref == 'refs/heads/main'
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p /tmp/out && cp "$APK" "/tmp/out/Blaze-v$VER.apk"
          # Bridge copy (v0.8.0 renumbered 1.x -> 0.x): older Blazes compare names and need one that sorts
          # above 1.17.0; v0.8.0+ reads the build number from it. Same APK, same signature.
          cp "$APK" "/tmp/out/Blaze-v1.999.$CODE.apk"
          cd /tmp/out
          git init -q -b apk
          git config user.name "Blaze CI"; git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          echo "$VER ${{ github.sha }} $CODE" > LATEST
          git add -A && git commit -qm "Blaze v$VER (${{ github.sha }})" && git push -q origin apk --force

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.repository == 'lacksonkapapahue/Blaze-agent' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          F="/tmp/out/Blaze-v$VER.apk"
          NOTES=$(git log -1 --format=%s ${{ github.sha }})
          if gh release view "v$VER" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release upload "v$VER" "$F" --clobber --repo ${{ github.repository }}
          else
            gh release create "v$VER" "$F" --repo ${{ github.repository }} --target ${{ github.sha }} --title "Blaze v$VER" --notes "$NOTES" --latest
          fi

      - name: Post failure log
        if: failure() && github.event_name != 'pull_request' && github.repository == 'lacksonkapapahue/Blaze-agent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Steps: ${{ join(steps.*.outcome, ', ') }}"; echo "Build failed on ${{ github.sha }} (run ${{ github.run_id }})"; echo; echo '```'; grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log 2>/dev/null | head -120; echo '----- tail -----'; tail -80 build.log 2>/dev/null || echo "no build.log (failed before Gradle ran)"; echo '```'; } > comment.md
          gh issue edit 1 --repo ${{ github.repository }} --body-file comment.md
