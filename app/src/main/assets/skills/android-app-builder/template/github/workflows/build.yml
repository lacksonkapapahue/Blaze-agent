name: Build APK

# Made from Blaze's Android template. Every push to main builds a signed APK and publishes it
# as the latest GitHub release (asset app.apk), which Blaze downloads and installs on the phone.
# Blaze never edits this file (that needs GitHub's "workflow" permission); it only changes the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (made once, then reused)
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/release.jks -alias app -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=${{ github.repository_owner }}" -storepass blazeapp -keypass blazeapp
            git config user.name "Blaze CI"; git config user.email "ci@users.noreply.github.com"
            git add keystore/release.jks
            git commit -m "Add signing key [skip ci]"
            git push
          fi

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Errors (for Blaze)
        if: failure()
        run: |
          echo "::group::BLAZE_ERRORS"
          grep -E "^e: |error:|What went wrong|FAILURE|Unresolved reference|AAPT|Manifest merger" -A4 build.log | head -150 || true
          echo "::endgroup::"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk app.apk
          N=${{ github.run_number }}
          MSG=$(git log -1 --format=%s)
          gh release create "build-$N" app.apk --target "${{ github.sha }}" --title "Build $N" --notes "$MSG" --latest
